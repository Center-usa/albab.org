  <style>
    * { box-sizing: border-box; font-family: "Tahoma", Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #6ec6ff, #1976d2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px 40px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img {
      width: 80px;
      height: auto;
    }
    h1 {
      font-size: 25px;
      margin: 8px 0 4px;
    }
    p.subtitle {
      font-size: 20px;
      opacity: 0.95;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .link-btn {
      background: #fff;
      color: #0d47a1;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-height: 70px;
      gap: 6px;
    }

    .link-btn i {
      font-size: 24px;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    footer {
      margin-top: 26px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
